name: Build

on:
  push:
    branches: [main]
    # Tag vX.Y.Z to publish a release: Ferry boxes offer it to install the next time they open.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release with this version (e.g. 0.3.0). Leave empty for a normal build.'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags, for the version number

      # Version: a tag vX.Y.Z builds X.Y.Z; anything else builds "<latest tag>+dev.<run>", which the
      # in-app updater treats as that release (so it only offers newer tags). versionCode is the run
      # number, so each build installs over the last.
      - name: Version
        run: |
          if [[ -n "${{ inputs.release }}" ]]; then
            v="${{ inputs.release }}"; v="${v#v}"
            echo "RELEASE_TAG=v$v" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            last=$(git tag --list 'v*' --sort=-v:refname | head -1)
            v="${last#v}"; v="${v:-0.1.0}+dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "FERRY_VERSION=$v" >> "$GITHUB_ENV"
          echo "FERRY_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          echo "Building Ferry $v (code $((GITHUB_RUN_NUMBER + 100)))"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # Repo has no committed wrapper yet; generate one so ./gradlew works locally too.
      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.11.1; fi
          chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      # A database change must come with its schema (app/schemas) committed and a Migration, or
      # an update would wipe or crash on existing installs. The build regenerates the schema; this
      # compares it with what's committed.
      - name: Room schema is committed
        run: |
          python3 - <<'PY'
          import glob, json, subprocess, sys
          bad = []
          for f in glob.glob('app/schemas/*/*.json'):
              new = json.load(open(f))
              old = subprocess.run(['git', 'show', f'HEAD:{f}'], capture_output=True, text=True)
              if old.returncode != 0 or json.loads(old.stdout) != new:
                  bad.append(f)
          if bad:
              print('::error title=Room schema not committed::' + ', '.join(bad) +
                    ' is new or changed. Commit app/schemas (attached to this run as the room-schemas artifact),'
                    ' bump FerryDatabase.VERSION and add a Migration.')
              sys.exit(1)
          PY

      # Release (not debuggable) starts noticeably faster on TV boxes; debug is kept for diagnostics.
      - name: Assemble APKs
        run: ./gradlew assembleDebug assembleRelease --console=plain 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # Static analysis: reported, not enforced (yet). The reports are attached to the run.
      - name: Lint and detekt
        continue-on-error: true
        run: ./gradlew lintDebug detekt --continue --console=plain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
          if-no-files-found: ignore

      # The Room schema the build generated, so it can be committed alongside a database change.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore

      # Surface compiler / Gradle errors as a single annotation so they're readable from the API
      # (and on the run summary page) without downloading logs.
      - name: Summarise errors
        if: failure()
        run: |
          grep -E "^e: |^w: .*error|What went wrong|^> |FAILED|error:|Unresolved|Caused by" build.log \
            | grep -vE "^> Task" | head -80 > errors.txt || true
          { echo '### Build errors'; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          msg=$(python3 -c "import sys;print(open('errors.txt').read().replace('%','%25').replace('\\r','').replace('\\n','%0A'))")
          echo "::error title=Build errors::${msg}"
          # Failing unit tests: one annotation each with the assertion message.
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fail in list(tc.findall('failure')) + list(tc.findall('error')):
                      text = (fail.get('message') or '') + '\n' + '\n'.join((fail.text or '').splitlines()[:6])
                      text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                      print(f"::error title={tc.get('classname')}.{tc.get('name')}::{text[:1500]}")
          PY

      # Rolling "nightly" pre-release with a stable URL, so devices (or HA) can fetch the latest build:
      # https://github.com/<owner>/<repo>/releases/download/nightly/ferry.apk  (ferry-debug.apk for diagnostics)
      - name: Publish nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ferry-debug.apk
          cp app/build/outputs/apk/release/app-release.apk ferry.apk
          cp app/build/outputs/mapping/release/mapping.txt ferry-mapping.txt
          git tag -f nightly && git push -f origin nightly
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly --prerelease --title "Nightly" --notes "Latest debug build from main."
          gh release edit nightly --notes "Latest debug build from main (${GITHUB_SHA::7})."
          gh release upload nightly ferry.apk ferry-debug.apk ferry-mapping.txt --clobber

      # Tagged release: a normal (non-pre) GitHub release, which is what the app's updater and the
      # Home Assistant update entity look at. ferry.apk keeps a fixed name for the updater.
      # Either a pushed tag, or "Run workflow" with a version (CI creates the tag on this commit).
      - name: Publish release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ferry.apk
          cp app/build/outputs/apk/debug/app-debug.apk ferry-debug.apk
          cp app/build/outputs/mapping/release/mapping.txt ferry-mapping.txt
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Ferry $FERRY_VERSION" --generate-notes
          gh release upload "$RELEASE_TAG" ferry.apk ferry-debug.apk ferry-mapping.txt --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: ferry-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
