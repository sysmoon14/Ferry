name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # Repo has no committed wrapper yet; generate one so ./gradlew works locally too.
      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.11.1; fi
          chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # Surface compiler / Gradle errors as a single annotation so they're readable from the API
      # (and on the run summary page) without downloading logs.
      - name: Summarise errors
        if: failure()
        run: |
          grep -E "^e: |^w: .*error|What went wrong|^> |FAILED|error:|Unresolved|Caused by" build.log \
            | grep -vE "^> Task" | head -80 > errors.txt || true
          { echo '### Build errors'; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          msg=$(python3 -c "import sys;print(open('errors.txt').read().replace('%','%25').replace('\\r','').replace('\\n','%0A'))")
          echo "::error title=Build errors::${msg}"

      # Rolling "nightly" pre-release with a stable URL, so devices (or HA) can fetch the latest build:
      # https://github.com/<owner>/<repo>/releases/download/nightly/ferry-debug.apk
      - name: Publish nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ferry-debug.apk
          git tag -f nightly && git push -f origin nightly
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly --prerelease --title "Nightly" --notes "Latest debug build from main."
          gh release edit nightly --notes "Latest debug build from main (${GITHUB_SHA::7})."
          gh release upload nightly ferry-debug.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: ferry-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
