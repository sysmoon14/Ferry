# detekt: the defaults, minus the rules that fight Jetpack Compose's conventions.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 200
  WildcardImport:
    active: false
